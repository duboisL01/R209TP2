<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shifumi</title>
</head>

<body>
    <p>Score</p>
    Choisir :
    <input type="radio" id="Pierre" name="case"/>
    <label for="Pierre">Pierre</label>
    <input type="radio" id="Feuille" name="case" />
    <label for="Feuille">Feuille</label>
    <input type="radio" id="Ciseaux" name="case" checked />
    <label for="Ciseaux">Ciseaux</label>
    <br>
    <br>
    <input type="submit" id="bouton" value="Jouer" />
    <script>
        function jouer() {
            bouton = document.getElementById("bouton")
            bouton.addEventListener("click", jouer)
        }
    </script>
</body>

</html>
