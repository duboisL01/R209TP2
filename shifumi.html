<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shifumi</title>
</head>

<body>
    <input type="radio" name="case" id="pierre"> Pierre
    <input type="radio" name="case" id="Papier"> Papier
    <input type="radio" name="case" id="Ciseaux"> Ciseaux
    <br>
    <input type="submit" id="bouton">
    <p id="paragraphe"></p>
    <script>
        let compteur = 0;
        function increment() {
            compteur++;
        p = document.getElementById("paragraphe");
        p.innerText = "compteur=" + compteur;
        }
        b = document.getElementById("bouton");
        b.addEventListener("click", increment);
    </script>
</body>

</html>
